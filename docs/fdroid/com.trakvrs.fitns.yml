# Draft build recipe for F-Droid. It doesn't do anything in this repo:
# submit it as metadata/com.trakvrs.fitns.yml in a merge request to
# https://gitlab.com/fdroid/fdroiddata, after tagging v0.1.0.
# Keep the flutter srclib version in step with .github/workflows/*.yml.
Categories:
  - Sports & Health
License: MIT
AuthorName: Parth Magdum
SourceCode: https://github.com/Parthmagdum/FITNS
IssueTracker: https://github.com/Parthmagdum/FITNS/issues
Changelog: https://github.com/Parthmagdum/FITNS/blob/main/CHANGELOG.md

AutoName: FITNS

RepoType: git
Repo: https://github.com/Parthmagdum/FITNS.git

Builds:
  - versionName: 0.1.0
    versionCode: 9
    commit: v0.1.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.8
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.0
CurrentVersionCode: 9
